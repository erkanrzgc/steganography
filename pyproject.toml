[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberm4fia-steganography"
version = "0.5.0"
description = "Dual-purpose steganography toolkit: embed/extract + steganalysis"
requires-python = ">=3.11"
authors = [{ name = "erkanrzgc" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = [
    "benchmarking",
    "dfir",
    "fastapi",
    "forensics",
    "security",
    "steganalysis",
    "steganography",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=41",
    "numpy>=1.26",
    "piexif>=1.1",
    "pillow>=10",
    "python-dotenv>=1.0",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/erkanrzgc/steganography"
Repository = "https://github.com/erkanrzgc/steganography"
Issues = "https://github.com/erkanrzgc/steganography/issues"
Changelog = "https://github.com/erkanrzgc/steganography/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ai = ["httpx>=0.27"]
api = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "platformdirs>=4.2",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]
dct = ["jpeglib>=0.14"]
dev = [
    "build>=1.2",
    "httpx2>=2.10",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.scripts]
steganography = "steganography.__main__:main"

[project.entry-points."steganography.carriers"]
# Third-party distributions may publish Carrier instances/classes in this group.

[project.entry-points."steganography.analyzers"]
# Third-party distributions may publish Analyzer instances/classes in this group.

[tool.setuptools]
py-modules = ["cli", "config", "registry"]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "core*", "modules*", "report*", "steganography*", "ui*"]
exclude = ["tests*", "venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=config --cov=ui --cov=core --cov=registry --cov=modules --cov=report --cov=api --cov=steganography --cov=cli --cov-report=term-missing"

[tool.coverage.run]
source = ["api", "core", "modules", "ui", "report", "steganography", "registry", "config", "cli"]
omit = ["tests/*", "modules/image_jpeg_dct_worker.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["jpeglib", "piexif"]
ignore_missing_imports = true
