name: Full image smoke

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile.full
      - tools/**
      - scripts/docker-ctf-smoke.py
      - scripts/docker-ctf-matrix.py
      - steganography/benchmarking/ctf_matrix.py
      - modules/audio_wav.py
      - scripts/full-image-inventory.py
      - scripts/openstego-headless.sh
      - core/tool_inventory.py
      - core/tools.py
      - core/ctf*.py
      - modules/external_tools.py
      - .github/workflows/full-image-smoke.yml
  pull_request:
    paths:
      - Dockerfile.full
      - tools/**
      - scripts/docker-ctf-smoke.py
      - scripts/docker-ctf-matrix.py
      - steganography/benchmarking/ctf_matrix.py
      - modules/audio_wav.py
      - scripts/full-image-inventory.py
      - scripts/openstego-headless.sh
      - core/tool_inventory.py
      - core/tools.py
      - core/ctf*.py
      - modules/external_tools.py
      - .github/workflows/full-image-smoke.yml

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f Dockerfile.full -t steganography-full-smoke .
      - name: Non-root read-only exact recovery smoke
        run: >-
          docker run --rm --read-only --network none --cap-drop ALL
          --security-opt no-new-privileges --pids-limit 128
          --tmpfs /tmp:rw,noexec,nosuid,size=128m
          --mount type=bind,src="${{ github.workspace }}/scripts/docker-ctf-smoke.py",dst=/smoke.py,readonly
          --entrypoint python steganography-full-smoke /smoke.py
      - name: Independent encoder recovery matrix (development fixtures, not blind accuracy)
        run: >-
          docker run --rm --read-only --network none --cap-drop ALL
          --security-opt no-new-privileges --pids-limit 128
          --tmpfs /tmp:rw,noexec,nosuid,size=128m
          --mount type=bind,src="${{ github.workspace }}/scripts/docker-ctf-matrix.py",dst=/matrix.py,readonly
          --entrypoint python steganography-full-smoke /matrix.py > ctf-development-matrix.json
      - name: Export verified inventory (not a detection benchmark)
        run: >-
          docker run --rm --read-only --network none --cap-drop ALL
          --security-opt no-new-privileges --pids-limit 128
          --entrypoint cat steganography-full-smoke
          /usr/share/steganography/full-image-inventory.json > full-image-inventory.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-image-inventory
          path: full-image-inventory.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctf-development-matrix
          path: ctf-development-matrix.json
          if-no-files-found: error
