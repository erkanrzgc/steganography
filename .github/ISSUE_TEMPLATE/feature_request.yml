name: Feature request
description: Suggest a focused improvement to analysis, recovery, or evidence workflows.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What task is difficult today? Avoid private evidence or credentials.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the expected behavior, alternatives, and a way to verify it.
    validations:
      required: true
