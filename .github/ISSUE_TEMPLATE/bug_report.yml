name: Bug report
description: Report a reproducible problem with an existing workflow.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow SECURITY.md instead of posting exploit details here.
        Never attach passwords, API keys, private evidence, or unredacted host paths.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Tool version, Python version, OS, interface, and relevant optional tools.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps or redacted command; use a harmless fixture if possible.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include relevant error text or unavailable coverage, with secrets removed.
    validations:
      required: true
